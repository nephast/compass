# agent-tools (COMPASS-21/22). ClusterIP only, admitted from api pods only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-tools
  annotations:
    eks.amazonaws.com/role-arn: REPLACED_BY_OVERLAY
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-tools
  labels: { app.kubernetes.io/name: agent-tools, app.kubernetes.io/part-of: compass }
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: agent-tools }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: agent-tools, app.kubernetes.io/part-of: compass }
    spec:
      serviceAccountName: agent-tools
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: agent-tools
          image: compass-agent-tools
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: compass-config }
          env:
            - { name: SERVICE_NAME, value: agent-tools }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 16Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: agent-tools
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: agent-tools }
  ports:
    - { name: http, port: 80, targetPort: http }
