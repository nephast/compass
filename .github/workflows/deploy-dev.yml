name: Deploy to dev

# COMPASS-26/27/28. Every merge to main, unattended:
#
#   build-and-push (SHA-tagged images)  ─┐
#                                        ├─> deploy-k8s ─> smoke-test ─(fail)─> rollback
#   deploy-cdk (app infra + frontend)   ─┘
#
# Gated on vars.AWS_CI_ENABLED so the workflow is a no-op until the account
# and dev Terraform exist (docs/runbooks/deploy.md). prod is a separate,
# manually-approved workflow (promote-prod.yml) that re-deploys a SHA this
# workflow already proved.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC to AWS, no static keys in GitHub Secrets

# One deploy at a time; a newer merge waits rather than racing an older one.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & push ${{ matrix.service }}
    runs-on: ubuntu-latest
    if: vars.AWS_CI_ENABLED == 'true'
    environment: dev
    strategy:
      matrix:
        service: [api, agent-tools]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      # Tagged with the git SHA, into an IMMUTABLE repository: the tag that
      # passed dev is byte-for-byte what promote-prod deploys. A re-run of the
      # same SHA skips the push instead of failing on immutability.
      - name: Build & push
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/compass-${{ matrix.service }}:${{ github.sha }}
        run: |
          if aws ecr describe-images --repository-name compass-${{ matrix.service }} \
               --image-ids imageTag=${{ github.sha }} >/dev/null 2>&1; then
            echo "$IMAGE already pushed"; exit 0
          fi
          docker build -t "$IMAGE" -f apps/${{ matrix.service }}/Dockerfile .
          docker push "$IMAGE"

  deploy-cdk:
    name: Deploy CDK stacks (dev)
    runs-on: ubuntu-latest
    if: vars.AWS_CI_ENABLED == 'true'
    environment: dev
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Built here so the Site stack ships it and invalidates CloudFront in
      # the same deploy (COMPASS-24).
      - run: npm run build -w @compass/frontend
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: cdk deploy
        working-directory: infra/cdk
        run: npx cdk deploy --all --require-approval never --context env=dev --no-notices

  deploy-k8s:
    name: Roll out api/agent-tools (dev)
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-cdk]
    environment: dev
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1
      - run: scripts/k8s-deploy.sh dev ${{ github.sha }}

  smoke-test:
    name: Post-deploy smoke test (dev)
    runs-on: ubuntu-latest
    needs: deploy-k8s
    environment: dev
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: scripts/smoke-test.sh dev
      # COMPASS-28 stretch: a failed smoke test rolls the Deployments back to
      # their previous ReplicaSets. Infra (CDK) is not rolled back -- it is
      # backward compatible by convention, and CloudFormation already rolled
      # back any stack update that failed.
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1
        if: failure()
      - name: Roll back on failure
        if: failure()
        run: |
          aws eks update-kubeconfig --region "${{ vars.AWS_REGION }}" --name compass-dev
          kubectl -n compass rollout undo deployment/api
          kubectl -n compass rollout undo deployment/agent-tools
          kubectl -n compass rollout status deployment/api --timeout=180s
          echo "::error::Smoke test failed; dev rolled back to the previous revision."
