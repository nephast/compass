name: Promote to prod

# COMPASS-27. Manually triggered only, and gated behind the "prod" GitHub
# Environment's required reviewers: the job -- and therefore its OIDC token,
# which the deploy role's trust policy only accepts for environment:prod --
# does not exist until someone clicks Approve. "prod never changes without
# an explicit click" is enforced by GitHub and IAM, not by convention.
#
# Promotion re-deploys a SHA dev already ran. Nothing is rebuilt: the image
# in ECR is immutable, so prod runs the exact bytes that passed the dev smoke
# test.
#
# A prod environment does not exist yet (cost: a second EKS control plane).
# vars.PROD_ENABLED keeps this a no-op until it does; see docs/runbooks/deploy.md.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Git SHA (image tag) to promote from dev, already verified there"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  promote:
    name: Deploy verified image to prod
    runs-on: ubuntu-latest
    if: vars.PROD_ENABLED == 'true'
    environment: prod # required reviewers configured on this environment
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Refuse anything that is not a full commit SHA
        run: '[[ "${{ inputs.image_tag }}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::image_tag must be a 40-char git SHA"; exit 1; }'
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1
      - run: scripts/k8s-deploy.sh prod ${{ inputs.image_tag }}
      - run: scripts/smoke-test.sh prod
