name: PR checks

# Runs on every PR into main. Nothing merges without this passing — see
# CONTRIBUTING.md and branch protection settings (COMPASS-3).

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write # for the commitlint / diff comments below

jobs:
  lint-typecheck-test:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      # Unit tier only — test:integration and test:wiring need LocalStack and
      # Postgres. TODO (COMPASS-25): add service containers so they run here
      # too, plus coverage reporting (the old `-- --coverage` flag never
      # reached vitest through the workspace fan-out).

  dependency-audit:
    name: npm audit (fail on high/critical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  container-scan:
    name: Trivy image scan (api, agent-tools)
    runs-on: ubuntu-latest
    if: false # TODO (COMPASS-25): flip on once apps/api and apps/agent-tools have Dockerfiles
    strategy:
      matrix:
        service: [api, agent-tools]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build image
        run: docker build -t compass-${{ matrix.service }}:pr -f apps/${{ matrix.service }}/Dockerfile apps/${{ matrix.service }}
      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0 — pinned, see docs/runbooks/security-baseline.md
        with:
          image-ref: compass-${{ matrix.service }}:pr
          severity: CRITICAL,HIGH
          exit-code: 1

  terraform-security:
    name: tfsec + checkov (Terraform)
    runs-on: ubuntu-latest
    # Flipped on for COMPASS-5: infra/terraform/modules/vpc has real resources
    # to scan now (a security group, an EC2 instance). continue-on-error on
    # both steps because COMPASS-25 still owes real failure thresholds and
    # the explanatory PR comment — this is early signal, not enforcement.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: tfsec
        uses: aquasecurity/tfsec-action@b466648d6e39e7c75324f25d83891162a721f2d6 # SHA for v1.0.3
        continue-on-error: true
        with:
          working_directory: infra/terraform
      - name: checkov
        uses: bridgecrewio/checkov-action@8c07e78c64ddc2209d8c193a4e321aad67677f8d # SHA for v12.999.0
        continue-on-error: true
        with:
          directory: infra/terraform
