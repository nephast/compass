name: PR checks

# Runs on every PR into main. Nothing merges without this passing — see
# CONTRIBUTING.md and branch protection settings (COMPASS-3).
#
# COMPASS-25: every gate here is binding (no continue-on-error), and the
# security gates explain themselves in a PR comment when they fail, so a red
# check says WHY without anyone opening a log.
#
# Every action reference is pinned to a full commit SHA with a version comment (#59,
# option a): a tag is mutable, a SHA is not.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write # failure explanations posted as PR comments

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    name: Lint, typecheck, unit tests, builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Includes infra/cdk's assertion tests: an offline synth of every stack,
      # checking the permissions boundary, private buckets, the authorizer.
      - run: npm run test
      - name: Build frontend (static export)
        run: npm run build -w @compass/frontend
      - name: Bundle services
        run: npm run build -w @compass/api -w @compass/agent-tools

  integration:
    name: Integration tests (pgvector + LocalStack)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: compass
          POSTGRES_PASSWORD: compass
          POSTGRES_DB: compass
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U compass -d compass"
          --health-interval 2s --health-timeout 3s --health-retries 15
      localstack:
        image: localstack/localstack:3
        env:
          SERVICES: s3
        ports: ["4566:4566"]
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 3s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://compass:compass@localhost:5432/compass
      LOCALSTACK_ENDPOINT: http://localhost:4566
      AWS_REGION: eu-west-1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Migrations run twice: the second run must apply zero (COMPASS-14).
      - run: npm run migrate && npm run migrate | tee migrate.txt && grep -q "0 migration(s) applied" migrate.txt
      - run: npm run bootstrap -w @compass/ingestion
      - run: npm run test:integration

  dependency-audit:
    name: npm audit (fail on high/critical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: npm audit
        run: npm audit --audit-level=high 2>&1 | tee audit.txt
      - name: Explain the failure on the PR
        if: failure()
        continue-on-error: true # fork PRs have a read-only token
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const audit = fs.readFileSync('audit.txt', 'utf8').slice(-6000);
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
              body: [
                '### ❌ Dependency audit failed',
                'This PR introduces (or leaves) a dependency with a **high or critical** advisory.',
                'Fix: upgrade the package, or pin a patched transitive version in the root `overrides`.',
                '', '<details><summary>npm audit output</summary>', '', '```', audit, '```', '</details>',
              ].join('\n'),
            });

  container-scan:
    name: Trivy image scan (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, agent-tools]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Repo-root context: the services build from npm workspaces.
      - name: Build image
        run: docker build -t compass-${{ matrix.service }}:pr -f apps/${{ matrix.service }}/Dockerfile .
      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0 — pinned, see docs/runbooks/security-baseline.md
        with:
          image-ref: compass-${{ matrix.service }}:pr
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
          format: table
          output: trivy.txt
      - name: Show findings
        if: always()
        run: cat trivy.txt 2>/dev/null || true
      - name: Explain the failure on the PR
        if: failure()
        continue-on-error: true
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const report = fs.existsSync('trivy.txt') ? fs.readFileSync('trivy.txt', 'utf8').slice(0, 6000) : '(no report)';
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
              body: [
                '### ❌ Container scan failed: `${{ matrix.service }}`',
                'The image has a **fixable** HIGH or CRITICAL vulnerability (unfixed ones are ignored).',
                'Usually: bump the `node:24-alpine` base digest or the dependency named below.',
                '', '<details><summary>Trivy report</summary>', '', '```', report, '```', '</details>',
              ].join('\n'),
            });

  terraform-security:
    name: tfsec + checkov (Terraform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: tfsec
        uses: aquasecurity/tfsec-action@b466648d6e39e7c75324f25d83891162a721f2d6 # v1.0.3
        with:
          working_directory: infra/terraform
          additional_args: --minimum-severity HIGH
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # checkov from PyPI at a pinned version rather than the action (#57): the
      # action's bundled parser silently failed to parse two modules while the
      # job stayed green.
      - name: Install checkov
        run: pip install "checkov==3.2.469"
      - name: checkov
        run: |
          set +e
          checkov -d infra/terraform --framework terraform --quiet --compact -o cli -o json \
            --output-file-path console,checkov.json
          status=$?
          set -e
          # #57's load-bearing criterion: a file checkov cannot parse produces
          # no findings, which looks identical to a clean file. Fail on ANY
          # parse error, whatever the exit code says.
          python3 - <<'PY'
          import json, sys
          data = json.load(open("checkov.json"))
          reports = data if isinstance(data, list) else [data]
          errors = sum(int(r.get("summary", {}).get("parsing_errors", 0)) for r in reports)
          if errors:
              print(f"checkov could not parse {errors} file(s) -- failing rather than reporting a clean scan")
              sys.exit(1)
          print("checkov parsed every file")
          PY
          exit $status
      - name: Explain the failure on the PR
        if: failure()
        continue-on-error: true
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            let failed = [];
            try {
              const data = JSON.parse(fs.readFileSync('checkov.json', 'utf8'));
              for (const r of (Array.isArray(data) ? data : [data])) failed.push(...(r.results?.failed_checks ?? []));
            } catch { /* tfsec failed first */ }
            const lines = failed.slice(0, 30).map(c => `- \`${c.check_id}\` ${c.check_name} — \`${c.file_path}\` (${c.resource})`);
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
              body: [
                '### ❌ Terraform security scan failed',
                'tfsec (HIGH+) or checkov found a misconfiguration — for example an open security group or a public bucket.',
                'Fix it, or suppress it inline with `# checkov:skip=<ID>:<reason>` where the trade-off is deliberate and written down.',
                '', ...(lines.length ? lines : ['See the job log for the tfsec finding.']),
              ].join('\n'),
            });

  k8s-manifests:
    name: Kubernetes manifests render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: kustomize build (dev overlay, example config)
        run: |
          cd infra/k8s/overlays/dev
          cp config.env.example config.env && cp irsa.env.example irsa.env
          kubectl kustomize . > /tmp/rendered.yaml
          grep -q "kind: HorizontalPodAutoscaler" /tmp/rendered.yaml
          grep -q "pod-security.kubernetes.io/enforce: restricted" /tmp/rendered.yaml
