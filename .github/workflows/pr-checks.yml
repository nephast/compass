name: PR checks

# Runs on every PR into main. Nothing merges without this passing — see
# CONTRIBUTING.md and branch protection settings (COMPASS-3).

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write # for the commitlint / diff comments below

jobs:
  conventional-commits:
    name: Conventional commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6

  lint-typecheck-test:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -- --coverage
      # TODO (COMPASS-25): upload coverage as a PR comment or artifact

  dependency-audit:
    name: npm audit (fail on high/critical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  container-scan:
    name: Trivy image scan (api, agent-tools)
    runs-on: ubuntu-latest
    if: false # TODO (COMPASS-25): flip on once apps/api and apps/agent-tools have Dockerfiles
    strategy:
      matrix:
        service: [api, agent-tools]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t compass-${{ matrix.service }}:pr -f apps/${{ matrix.service }}/Dockerfile apps/${{ matrix.service }}
      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: compass-${{ matrix.service }}:pr
          severity: CRITICAL,HIGH
          exit-code: 1

  terraform-security:
    name: tfsec + checkov (Terraform)
    runs-on: ubuntu-latest
    if: false # TODO (COMPASS-25): flip on once infra/terraform has real modules to scan
    steps:
      - uses: actions/checkout@v4
      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infra/terraform
      - name: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/terraform
